name: Validate and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: idlecorp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U idlecorp -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgres://idlecorp:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify PostgreSQL and browser integration
        run: npm run test:e2e && npm run test:enhancements && npm run test:accounts && npm run test:lan-http
      - name: Verify the production planner and management workspace
        run: npm run test:production-targets && npm run test:facilities && npm run test:planner-workspace && npm run test:workspace-ux
      - name: Verify existing gameplay controls
        run: npm run test:ui && npm run test:ui-enhancements
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the exact runtime for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: idlecorp:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=idlecorp
          cache-to: type=gha,mode=max,scope=idlecorp
      - name: Verify the production container and persistent database
        run: |
          docker tag public.ecr.aws/docker/library/postgres:18-alpine postgres:18-alpine
          node scripts/test-container.mjs idlecorp:ci

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the lowercase container name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=IdleCorp
            org.opencontainers.image.description=Shared multiplayer industrial management game
      - name: Publish tested Linux images
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=idlecorp
          cache-to: type=gha,mode=max,scope=idlecorp
          provenance: mode=max
          sbom: true
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf 'Published image %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
